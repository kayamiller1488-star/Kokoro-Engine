<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VA Voice (AEC)</title>
<!--
  VA Voice - microphone and playback owner for Kokoro-Engine.

  Chromium's echo cancellation only subtracts audio that enters the graph of the
  document that owns the microphone, so the mic and her reply audio share one
  AudioContext here. The native path (cpal capture + cpal playback) leaks her own
  voice into the mic at ~+18 dB; measured ERLE of this document: ~16.5 dB.

  Capture rules learned the hard way (owner report 2026-11-22: "her hearing is
  worse now", "can you hear me" -> "you me me", slow speech -> Chinese 有有有有):
    * The graph runs at the device rate. WebRTC's canceller is built for 48 kHz;
      at 16 kHz it degrades and its residual suppression eats near-end speech. We
      decimate to 16 kHz ourselves, after the canceller, for SenseVoice.
    * noiseSuppression and autoGainControl stay OFF - telephony-tuned, they chew
      consonants. SenseVoice is robust; we do not need them.
    * ONE buffer, never two. The first version kept a pre-roll ring AND a speech
      buffer and prepended the ring to the buffer, duplicating the opening
      frames. Stuttered audio is exactly what makes an ASR reply 有有有有.

  Loop: mic -> VAD -> WAV -> ears :9882 -> transcript -> Kokoro.invoke
  ("mod_send_message") -> host turn -> chat-delta -> speak via :9881.
  No visible UI: the host mounts this in a 1x1 container ("ModHost").
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #log { display: none; }
</style>
<script src="/mod-sdk.js"></script>
</head>
<body>
<div id="log"></div>
<script>
(() => {
  "use strict";

  const EARS = "http://127.0.0.1:9882/transcribe";
  const MOUTH = "http://127.0.0.1:9881/v1/audio/speech";
  // Voice follows the active character: the engine broadcasts who is active and the
  // mouth (:9881) already owns one blend vector per name, so this stays a lookup.
  const VOICE = "sasha";
  const VOICES = { kana: "kana", sasha: "sasha" };
  const voiceFor = (id) => VOICES[String(id || "").toLowerCase()] || VOICE;
  // She writes cues inline as [smirk] because the prompt offers them. Never speak
  // the brackets: strip them before synthesis.
  const stripCues = (text) => String(text || "").replace(/\[[^\]\n]{1,40}\]/g, " ").replace(/\s{2,}/g, " ").trim();
  // Markdown and roleplay markup must never reach the mouth: the phonemizer reads
  // "*" as the word "asterisk" — measured, "*smiles softly*" is spoken as
  // "Assteric smiles, softly asterisk." Display keeps the markup; speech does not.
  const stripMarkup = (text) => String(text || "")
    .replace(/```[\s\S]*?```/g, " ")          // fenced code
    .replace(/`([^`]*)`/g, "$1")                // inline code
    .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")   // images
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")  // links -> label
    .replace(/[*_~]{1,3}/g, " ")                // **bold**, *action*, _italics_, ~~strike~~
    .replace(/^\s*[>#]+\s*/gm, " ")            // quotes and headings
    .replace(/^\s*[-•]\s+/gm, " ")             // bullets
    .replace(/[ \t]{2,}/g, " ")
    .trim();
  // Ellipses and stray symbols must be resolved here, not left to the mouth: a
  // punctuation-only fragment is spoken as a WORD — measured "." -> "Yeah.",
  // "..." -> "Yeah.", "~" -> "Tilda.", "*" -> "Astrais.", ".." -> "Tla." So
  // collapse ellipses to a comma pause and drop anything with no letters left.
  const forSpeech = (text) => {
    const clean = stripMarkup(stripCues(String(text || "")
      .replace(/[.\u2026]{2,}/g, ", ")     // "...", "…", ".." -> a pause
      .replace(/\u2026/g, ", ")
      .replace(/[~–—]+/g, " ")              // tildes and dashes are not words
      .replace(/\s+([,.!?;:])/g, "$1")));
    return /[\p{L}\p{N}]/u.test(clean) ? clean : "";
  };
  const ASR_RATE = 16000;
  const BLOCK = 4096;
  const ABS_MIN_RMS = 0.0015;
  const SPEECH_RATIO = 2.0;
  const SPEECH_S = 0.7;
  const SILENCE_S = 0.65;
  const PREROLL_S = 1.2;
  const MIN_UTTERANCE_S = 0.5;
  // Deaf window after her voice stops. It exists so her own reverb tail cannot be
  // transcribed as the next turn - but 900 ms swallowed quick replies: measured, a
  // 2.67 s question started 300 ms after she stopped was captured 1.56 s long with a
  // 900 ms guard. The tail itself is harmless: after playback the mic peaked at
  // 0.00064 against a 0.0015 speech threshold, so 300 ms is ~4x the margin the data
  // asks for. Runtime-overridable via __vaVoice.guardMs for measurement.
  const PLAYBACK_GUARD_MS = 300;
  const MAX_UTTERANCE_S = 15;

  const state = {
    characterId: "", voice: VOICE, micEnabled: true, earLanguage: "", lastEarsUrl: "",
    forSpeech: (t) => forSpeech(t),
    ctx: null, mic: null, source: null, proc: null, sink: null,
    started: false, lastError: null, aec: true,
    rate: 0, ratio: 1, fps: 12, starting: null, graphs: 0,
    roll: [], utt: null, loud: 0, silent: 0, speaking: false, busy: false,
    win: [], bargeWin: [], forcedThreshold: 0, released: 0, bargeIn: false, playbackStartedAt: 0,
    currentTurnId: "", interruptedTurn: "", turnOpen: false, turnStartedAt: 0, lastDeltaAt: 0,
    bargeMaxLevel: 0, bargeLoudFrames: 0,
    floor: ABS_MIN_RMS, meter: [], lastPlaybackEnd: 0, guardMs: PLAYBACK_GUARD_MS,
    heard: [], spoken: 0, lastWav: null, lastWavSeconds: 0,
    maxLevel: 0, maxThreshold: 0, history: [],
  };

  const say = (msg) => console.log("[va-voice]", msg);
  /** Seconds represented by `frames` capture frames. A frame is BLOCK samples at
   *  the capture rate (~85 ms); the decimated array inside it is not a time unit. */
  const framesToSeconds = (frames) => (frames * BLOCK) / (state.rate || 48000);
  const counts = () => ({
    speechFrames: Math.max(2, Math.round(SPEECH_S * state.fps)),
    loudNeeded: Math.max(2, Math.ceil(Math.round(SPEECH_S * state.fps) / 2)),
    bargeNeeded: Math.max(6, Math.ceil(0.5 * state.fps)),
    silenceFrames: Math.max(2, Math.round(SILENCE_S * state.fps)),
    prerollFrames: Math.max(2, Math.round(PREROLL_S * state.fps)),
  });

  window.__vaVoice = state;
  window.__vaVoiceResetLevels = () => { state.maxLevel = 0; state.maxThreshold = 0; };
  window.__vaVoiceDebug = {
    start: () => startAudio(),
    speak: (text) => enqueue(text || "Testing one two three."),
    restart: async (aec) => {
      await stopAudio();
      if (state.ctx) { try { await state.ctx.close(); } catch (_) {} }
      state.ctx = null; state.aec = !!aec;
      return startAudio();
    },
    lastWav: () => state.lastWav,
    /** Force (or clear, with 0) the speech threshold - lets a capture test run
     *  without a human in front of the mic. */
    forceGate: (threshold) => { state.forcedThreshold = Number(threshold) || 0; return state.forcedThreshold; },
    retranscribe: async () => {
      if (!state.lastWav) return { error: "no utterance captured yet" };
      const bytes = Uint8Array.from(atob(state.lastWav), (c) => c.charCodeAt(0));
      const res = await fetch(EARS, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: bytes });
      return await res.json();
    },
    sample: (ms = 1500) => new Promise((resolve) => {
      const from = state.meter.length;
      setTimeout(() => {
        const w = state.meter.slice(from);
        const sorted = [...w].sort((a, b) => a - b);
        const at = (q) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * q))] || 0;
        resolve({ frames: w.length, max: Math.max(0, ...w), median: at(0.5), p90: at(0.9), floor: state.floor });
      }, ms);
    }),
    stats: () => ({
      mic: state.started ? "open" : "closed",
      micError: state.lastError,
      captureRate: state.rate,
      asrRate: state.rate / state.ratio,
      decimation: state.ratio,
      ctxState: state.ctx && state.ctx.state,
      framesPerSecond: Number(state.fps.toFixed(2)),
      liveGraphs: state.graphs,
      bargeIn: state.bargeIn,
      counts: counts(),
      heard: state.heard.slice(-4),
      lastWavSeconds: state.lastWavSeconds,
      loudestLevel: Number(state.maxLevel.toFixed(4)),
      highestThreshold: Number(state.maxThreshold.toFixed(4)),
      spokenSentences: state.spoken,
      playing,
      queued: queue.length,
    }),
  };

  async function startAudio() {
    if (state.started && state.proc) return true;
    if (state.starting) return state.starting;
    state.starting = startAudioInner();
    try { return await state.starting; } finally { state.starting = null; }
  }

  async function startAudioInner() {
    // A previous graph may still be attached (stopAudio failed, or a second call
    // landed late). Tear it down before building the next one.
    if (state.proc || state.source || state.mic) await stopAudio();
    try {
      state.ctx = new AudioContext({ latencyHint: "interactive" });
      if (state.ctx.state === "suspended") await state.ctx.resume();
      state.rate = state.ctx.sampleRate;
      state.ratio = Math.max(1, Math.round(state.rate / ASR_RATE));
      if (Math.abs(state.rate / state.ratio - ASR_RATE) > ASR_RATE * 0.01) {
        say(`cannot decimate ${state.rate} Hz to ${ASR_RATE} Hz exactly; sending native rate`);
        state.ratio = 1;
      }
      state.fps = state.rate / BLOCK;

      // The host may switch the mic off while getUserMedia is still resolving; it
      // cannot see this in-flight permission, so the stream lands *after* stopAudio()
      // ran and the mic stays live while the icon says off. Re-check after every wait.
      if (state.micEnabled === false) { await stopAudio(); return false; }

      state.mic = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: state.aec,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1,
          sampleRate: state.rate,
        },
        video: false,
      });

      if (state.micEnabled === false) { await stopAudio(); return false; }

      state.source = state.ctx.createMediaStreamSource(state.mic);
      state.proc = state.ctx.createScriptProcessor(BLOCK, 1, 1);
      state.sink = state.ctx.createGain();
      state.sink.gain.value = 0;
      state.source.connect(state.proc);
      state.proc.connect(state.sink);
      state.sink.connect(state.ctx.destination);
      state.proc.onaudioprocess = onFrame;

      state.started = true;
      state.graphs += 1;
      say(`mic open (graph #${state.graphs}): capture ${state.rate} Hz -> asr ${state.rate / state.ratio} Hz (1/${state.ratio}), ${state.fps.toFixed(1)} fps, echoCancellation=${state.aec}`);
      announce({ mic: "open", captureRate: state.rate, asrRate: state.rate / state.ratio });
      return true;
    } catch (err) {
      state.lastError = String(err && err.message || err);
      say("mic failed: " + state.lastError);
      announce({ mic: "error", error: state.lastError });
      return false;
    }
  }

  async function stopAudio() {
    try { if (state.currentSrc) state.currentSrc.stop(); } catch (_) {}
    state.currentSrc = null;
    playing = false;
    queue.length = 0;
    try { if (state.proc) state.proc.disconnect(); } catch (_) {}
    try { if (state.source) state.source.disconnect(); } catch (_) {}
    try { if (state.mic) state.mic.getTracks().forEach((t) => t.stop()); } catch (_) {}
    try { if (state.sink) state.sink.disconnect(); } catch (_) {}
    state.proc = state.source = state.mic = state.sink = null;
    state.started = false;
    state.graphs = Math.max(0, state.graphs - 1);
    state.roll = []; state.utt = null; state.loud = 0; state.silent = 0; state.speaking = false;
  }

  function announce(payload) {
    try { Kokoro.emit("va-voice-state", payload); } catch (_) {}
  }

  function rms(buf) {
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    return Math.sqrt(sum / buf.length);
  }

  function decimate(input) {
    const r = state.ratio;
    if (r <= 1) return input.slice(0);
    const out = new Float32Array(Math.floor(input.length / r));
    for (let i = 0; i < out.length; i++) {
      let sum = 0;
      for (let k = 0; k < r; k++) sum += input[i * r + k];
      out[i] = sum / r;
    }
    return out;
  }

  function onFrame(ev) {
    const input = ev.inputBuffer.getChannelData(0);
    const level = rms(input);
    state.meter.push(level);
    if (state.meter.length > 240) state.meter.shift();

    state.history.push(level);
    if (state.history.length > 48) state.history.shift();      // ~4 s at 11.7 fps
    if (state.history.length >= 8 && !state.speaking) {
      const sorted = [...state.history].sort((a, b) => a - b);
      state.floor = sorted[Math.floor(sorted.length * 0.2)] || ABS_MIN_RMS;
    }
    const threshold = state.forcedThreshold || Math.max(ABS_MIN_RMS, state.floor * (SPEECH_RATIO + 1.5));
    // Two levels: it takes a clearly loud frame to open the microphone's ear, but
    // only a quieter one to keep it open. One level made the endpoint wait for a
    // silence the room never delivered.
    const release = state.forcedThreshold || Math.max(ABS_MIN_RMS * 0.67, state.floor * (SPEECH_RATIO + 0.2));
    if (level > state.maxLevel) state.maxLevel = level;
    if (threshold > state.maxThreshold) state.maxThreshold = threshold;
    const c = counts();

    if (state.busy) return;
    const frame = decimate(input);
    // A streamed reply has gaps between sentences (the mouth is still generating the next one).
    // In those gaps `playing` is false and the mic re-opened, which transcribed her own sentence
    // tail as a new user turn ("The.") and that phantom turn then cut her off. Her turn counts as
    // live from the first delta until chat-done.
    const turnActive = state.turnOpen && (Date.now() - state.lastDeltaAt < 20000);

    if (playing || turnActive) {
      if (!state.bargeIn) {
        // Half-duplex fallback: deaf while she talks.
        state.roll = []; state.utt = null;
        state.loud = 0; state.silent = 0; state.speaking = false;
        return;
      }
      // Barge-in: keep listening while she speaks. Sustained speech stops her
      // mid-sentence and becomes the start of the next turn, pre-roll included so
      // the first word is not lost.
      state.roll.push(frame);
      if (state.roll.length > c.prerollFrames) state.roll.shift();
      // Her own voice coming back through the canceller sits around 0.006-0.01;
      // the owner's voice is 0.014+. Interrupting therefore needs a distinctly
      // louder, longer signal than starting a turn, or she cuts herself off and
      // transcribes her own sentence.
      // Measured on real speech: her echo with AEC on sits at 0.0008, the owner's interrupted
      // voice peaks around 0.019 but dips constantly, so 0.008 + an unbroken 10-frame run never
      // fired. 0.003 is ~4x the echo and 6-of-12 frames tolerates normal syllable dips.
      const bargeThreshold = state.forcedThreshold || Math.max(threshold * 1.5, 0.003);
      const settled = state.turnStartedAt && (Date.now() - state.turnStartedAt) > 400;
      // Diagnostics for tuning: what the mic actually sees while she holds the floor.
      if (level > state.bargeMaxLevel) state.bargeMaxLevel = level;
      if (level >= bargeThreshold) state.bargeLoudFrames += 1;
      // Its own window. The shared speech window is capped at speechFrames (~8 at 11.7 fps)
      // while interrupting needs bargeNeeded (~10), so testing the shared one could never be
      // satisfied and barge-in silently never fired.
      state.bargeWin.push(settled && level >= bargeThreshold);
      const bargeWindow = Math.max(c.bargeNeeded * 2, c.speechFrames);
      while (state.bargeWin.length > bargeWindow) state.bargeWin.shift();
      if (settled && state.bargeWin.filter(Boolean).length >= c.bargeNeeded) {
        say("barge-in: stopping her playback");
        interruptPlayback(true);
        state.speaking = true;
        state.utt = state.roll.slice();
        state.silent = 0;
      }
      return;
    }

    // Briefly deaf after she finishes: a reverb tail would otherwise be
    // transcribed as the user's next turn.
    if (Date.now() - state.lastPlaybackEnd < state.guardMs) {
      state.roll = []; state.utt = null;
      state.loud = 0; state.silent = 0; state.speaking = false;
      return;
    }

    // Rolling evidence window, not a run of consecutive frames: ordinary speech
    // dips below any single threshold between syllables, and a consecutive-frame
    // rule silently never fired on real speech.
    state.win.push(level >= threshold);
    while (state.win.length > c.speechFrames) state.win.shift();

    if (!state.speaking) {
      state.roll.push(frame);
      if (state.roll.length > c.prerollFrames) state.roll.shift();
      const loudFrames = state.win.filter(Boolean).length;
      if (loudFrames >= c.loudNeeded) {
        state.speaking = true;
        state.utt = state.roll.slice();
        state.silent = 0;
        say(`speech start (${framesToSeconds(state.utt.length).toFixed(2)} s in hand, ${loudFrames}/${state.win.length} loud)`);
      }
      return;
    }

    state.utt.push(frame);
    if (level >= release) state.silent = 0;
    else state.silent += 1;

    const asrRate = state.rate / state.ratio;
    const seconds = framesToSeconds(state.utt.length);
    const tooLong = seconds > MAX_UTTERANCE_S;
    if (state.silent >= c.silenceFrames || tooLong) {
      // Trim the tail relative to this utterance's own loudness, not to the room
      // floor: a steady noise bed above the floor kept a 2.2 s question open for
      // 7 s, and the ASR invented words in the padding ("capitality").
      let utterance = state.utt;
      const levels = utterance.map((f) => rms(f)).sort((a, b) => a - b);
      const p90 = levels[Math.floor(levels.length * 0.9)] || 0;
      const cut = p90 * 0.25;
      let end = utterance.length;
      while (end > 1 && rms(utterance[end - 1]) < cut) end -= 1;
      // Short utterances live or die on their last mora: 日本語「いいよ」 came back as
      // "Yよ。" and 「うん」 as Chinese 嗯。 when the tail was shaved. Keep at most 10%
      // of the frames off the end (plus 4 frames of slack) and let the ASR hear it.
      const floorEnd = utterance.length - Math.max(4, Math.round(utterance.length * 0.10));
      end = Math.max(end, floorEnd);
      utterance = utterance.slice(0, Math.min(utterance.length, end + 4));
      state.utt = null;
      state.roll = [];
      state.speaking = false;
      state.loud = 0;
      state.silent = 0;
      if (seconds >= MIN_UTTERANCE_S) void handleUtterance(utterance, asrRate);
      else say(`ignored a ${seconds.toFixed(2)}s blip`);
    }
  }

  async function handleUtterance(chunks, asrRate) {
    state.busy = true;
    try {
      // Peak-normalise to 0.85. AutoGainControl is off on purpose (it pumps and
      // hides syllables), so makeup gain belongs here, once, on the exact audio
      // the ASR will see - not as a live AGC in the capture path.
      let peakIn = 0;
      for (const chunk of chunks) for (let i = 0; i < chunk.length; i++) {
        const v = Math.abs(chunk[i]); if (v > peakIn) peakIn = v;
      }
      const gain = peakIn > 0.02 && peakIn < 0.85 ? 0.85 / peakIn : 1;
      const scaled = gain === 1 ? chunks : chunks.map((chunk) => {
        const out = new Float32Array(chunk.length);
        for (let i = 0; i < chunk.length; i++) out[i] = chunk[i] * gain;
        return out;
      });

      // 200 ms of silence on the tail. Measured on short Japanese: 「いいよ」 went
      // from "Yよ。" to "いいよ。", 「うん」 from 嗯。 (Chinese) to うん。 (Japanese).
      const tail = new Float32Array(Math.round(asrRate * 0.2));
      const wav = encodeWav(tail.length ? [...scaled, tail] : scaled, asrRate);
      let totalSamples = 0;
      for (const chunk of chunks) totalSamples += chunk.length;
      state.lastWavSeconds = totalSamples / asrRate;
      let sum = 0, peak = 0, n = 0;
      for (const chunk of chunks) {
        for (let i = 0; i < chunk.length; i++) {
          const v = chunk[i]; sum += v * v; n += 1;
          if (Math.abs(v) > peak) peak = Math.abs(v);
        }
      }
      const captured = { bytes: wav.byteLength, seconds: Number(state.lastWavSeconds.toFixed(2)), frames: chunks.length,
                         rms: Number(Math.sqrt(sum / Math.max(1, n)).toFixed(4)), peak: Number(peak.toFixed(3)),
                         gain: Number(gain.toFixed(1)) };

      const view = new Uint8Array(wav);
      let binary = "";
      for (let i = 0; i < view.length; i += 0x8000) {
        binary += String.fromCharCode.apply(null, view.subarray(i, i + 0x8000));
      }
      state.lastWav = btoa(binary);

      const t0 = performance.now();
      const earsUrl = state.earLanguage ? `${EARS}?language=${encodeURIComponent(state.earLanguage)}` : EARS;
      state.lastEarsUrl = earsUrl;
      const res = await fetch(earsUrl, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: wav });
      const data = await res.json();
      const ms = Math.round(performance.now() - t0);
      const raw = (data.text || "").trim();
      // Short Japanese answers are two characters - 「はい」, 「うん」 - and a flat
      // >= 3 rule threw them away silently, which reads exactly like "she ignored me".
      // Keep the higher bar for Latin, where 1-2 characters is usually ASR noise.
      const letters = (raw.match(/[\p{L}\p{N}]/gu) || []).length;
      const latinOnly = /^[\p{Script=Latin}\p{N}\p{P}\s]+$/u.test(raw);
      const text = letters >= (latinOnly ? 2 : 1) ? raw : "";
      state.heard.push({ text: raw, ms, seconds: captured.seconds, rms: captured.rms, peak: captured.peak });
      say(`heard (${ms} ms, ${captured.seconds}s, rms ${captured.rms}, peak ${captured.peak}, gain x${captured.gain}): ${raw || "<nothing>"}`);
      announce({ heard: text, ms, captured });
      if (!text) return;
      await Kokoro.invoke("mod_send_message", { message: text });
    } catch (err) {
      say("utterance failed: " + (err && err.message || err));
    } finally {
      state.busy = false;
    }
  }

  function encodeWav(chunks, rate) {
    let length = 0;
    for (const c of chunks) length += c.length;
    const buffer = new ArrayBuffer(44 + length * 2);
    const view = new DataView(buffer);
    const write = (offset, str) => {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    };
    write(0, "RIFF");
    view.setUint32(4, 36 + length * 2, true);
    write(8, "WAVE");
    write(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, rate, true);
    view.setUint32(28, rate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    write(36, "data");
    view.setUint32(40, length * 2, true);
    let offset = 44;
    for (const chunk of chunks) {
      for (let i = 0; i < chunk.length; i++) {
        const s = Math.max(-1, Math.min(1, chunk[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        offset += 2;
      }
    }
    return buffer;
  }

  const queue = [];
  let playing = false;

  async function enqueue(text) {
    const sentence = text.trim();
    if (!sentence) return;
    // Nothing but punctuation or markup: there is no word to say.
    if (!/[\p{L}\p{N}]/u.test(forSpeech(sentence))) { say(`skipped a silent chunk: ${JSON.stringify(sentence)}`); return; }
    queue.push(sentence);
    if (!playing) void drain();
  }

  /** Stop whatever she is saying right now and drop anything queued. */
  function interruptPlayback(barged = false) {
    try { if (state.currentSrc) state.currentSrc.stop(); } catch (_) { /* already stopped */ }
    state.currentSrc = null;
    queue.length = 0;
    playing = false;
    state.bargeWin.length = 0;
    // He cut in, so there is no reverb tail to be deaf to: drop the post-playback guard,
    // otherwise the 300 ms deaf window eats the first syllables of the turn he just started.
    state.lastPlaybackEnd = barged ? 0 : Date.now();
    if (barged) {
      state.interruptedTurn = state.currentTurnId || "";
      state.turnOpen = false;
      state.bargeMaxLevel = 0;
      state.bargeLoudFrames = 0;
    }
  }

  async function drain() {
    if (playing) return;
    playing = true;
    while (queue.length) {
      const sentence = queue.shift();
      try {
        const res = await fetch(MOUTH, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: state.voice, input: forSpeech(sentence), voice: state.voice }),
        });
        if (!res.ok) throw new Error("mouth " + res.status);
        const wav = await res.arrayBuffer();
        const buffer = await state.ctx.decodeAudioData(wav);
        await new Promise((resolve) => {
          const src = state.ctx.createBufferSource();
          src.buffer = buffer;
          src.connect(state.ctx.destination);
          state.currentSrc = src;
          state.playbackStartedAt = Date.now();
          state.bargeWin.length = 0;
          src.onended = () => { state.currentSrc = null; resolve(); };
          src.start();
        });
        state.spoken += 1;
        state.lastPlaybackEnd = Date.now();
      } catch (err) {
        say("speak failed: " + (err && err.message || err));
      }
    }
    playing = false;
  }

  let pending = "";
  let lastDeltaKey = "";
  let lastDeltaAt = 0;

  function onDelta(payload) {
    // The sentence she was saying when he cut in must not resume: the app keeps streaming
    // the rest of that turn, and without this its remaining sentences are spoken over him.
    if (payload.turn_id) {
      if (payload.turn_id === state.interruptedTurn) { pending = ""; return; }
      if (payload.turn_id !== state.currentTurnId) {
        state.currentTurnId = payload.turn_id;
        state.interruptedTurn = "";
      }
    }
    const key = `${payload.turn_id || ""}:${payload.delta || ""}`;
    const now = Date.now();
    if (key === lastDeltaKey && now - lastDeltaAt < 1000) return;
    lastDeltaKey = key;
    lastDeltaAt = now;
    if (!state.turnOpen) { state.turnOpen = true; state.turnStartedAt = Date.now(); }
    state.lastDeltaAt = Date.now();
    pending += payload.delta || "";
    const match = pending.match(/^([\s\S]*?[.!?。！？\n])(\s*)([\s\S]*)$/);
    if (match) {
      enqueue(match[1]);
      pending = match[3];
    }
  }

  function onDone(payload) {
    state.turnOpen = false;
    state.bargeMaxLevel = 0;
    state.bargeLoudFrames = 0;
    if (payload && payload.status && payload.status !== "completed") { pending = ""; return; }
    if (pending.trim()) enqueue(pending);
    pending = "";
  }

  window.__msgLog = [];
  window.addEventListener("message", (event) => {
    const msg = event.data || {};
    window.__msgLog.push({ at: Date.now(), type: msg.type, name: msg.payload && msg.payload.name });
    if (window.__msgLog.length > 40) window.__msgLog.shift();
  });

  let announcements = 0;
  let lastHostMessage = Date.now();
  const announceReady = () => {
    announcements += 1;
    window.parent.postMessage({ type: "ready" }, "*");
  };
  window.addEventListener("message", () => { lastHostMessage = Date.now(); });
  announceReady();
  const readyTimer = setInterval(() => {
    if (announcements < 12 || Date.now() - lastHostMessage > 30000) announceReady();
    if (announcements >= 12 && Date.now() - lastHostMessage <= 30000) clearInterval(readyTimer);
  }, 2500);

  // The app's "Voice Interrupt" switch decides whether she may be talked over.
  // Its own interrupt service cannot see this frame's playback, so the host
  // broadcasts the value and we honour it here.
  // Who is active decides the voice; broadcast every 1.5 s by ModHost.
  Kokoro.on("character", (payload) => {
    const id = String(payload.id || "").toLowerCase();
    if (id && id !== state.characterId) {
      state.characterId = id;
      state.voice = voiceFor(id);
      say(`voice -> ${state.voice} (${id})`);
    }
  });
  Kokoro.on("voice-interrupt", (payload) => {
    state.bargeIn = !!payload.enabled;
    say(`barge-in ${state.bargeIn ? "on" : "off"}`);
  });
  // The chat mic button is the single switch: off must actually stop capture, on
  // must reopen it. Without this the icon said "off" while the frame kept hearing.
  // Language hint for the ears: "" = auto. A pinned language is what turns
  // 'Knaan.' into 'かなちゃん。' when a short Japanese phrase is too quiet to
  // be auto-detected. Costs a second recognizer (~270 MB) only when pinned.
  Kokoro.on("ears", (payload) => {
    const language = String((payload && payload.language) || "").toLowerCase();
    if (language !== state.earLanguage) {
      state.earLanguage = language;
      say(`ears language -> ${language || "auto"}`);
    }
  });
  Kokoro.on("mic", (payload) => {
    const enabled = !(payload && payload.enabled === false);
    if (enabled === state.micEnabled) return;
    state.micEnabled = enabled;
    say(`mic ${enabled ? "on" : "off"}`);
    if (enabled) {
      state.busy = false;
      void startAudio();
    } else {
      // Stop now AND after any in-flight start completes, or a permission prompt
      // that resolves later re-opens the microphone the owner just closed.
      const inFlight = state.starting;
      void stopAudio();
      if (inFlight) void inFlight.then(() => stopAudio()).catch(() => {});
    }
  });
  Kokoro.on("chat-delta", (payload) => onDelta(payload));
  Kokoro.on("chat-done", (payload) => onDone(payload));
  Kokoro.on("update", () => { void startAudio(); });

  void startAudio().then((ok) => {
    if (!ok) {
      const retry = () => { void startAudio(); };
      window.addEventListener("pointerdown", retry, { once: true });
      window.addEventListener("keydown", retry, { once: true });
    }
  });
})();
</script>
</body>
</html>
